[package]
name = "orbit-engine"
version = "1.0.0"
edition = "2021"

[dependencies]
orbit-core = { path = "../core" }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp", "gif", "tiff"] }
lopdf = { version = "0.38", default-features = false, features = ["rayon"] }
rayon = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
windows = { workspace = true, features = ["Win32_Foundation", "Win32_System_Com", "Win32_Media_MediaFoundation", "Win32_UI_Shell", "Win32_UI_Shell_PropertiesSystem"] }
